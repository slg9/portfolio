<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#FFFFFF;color:#111;font-family:Helvetica,Arial,sans-serif;overflow:hidden;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(8,1fr);gap:0 24px;padding:40px 56px}
.r{grid-column:1/13;grid-row:1;border-bottom:2px solid #111;display:flex;justify-content:space-between;font-size:15px;font-weight:700}
h1{grid-column:1/9;grid-row:2/6;font-size:150px;font-weight:700;letter-spacing:-.05em;line-height:.85;align-self:end}
.red{grid-column:9/13;grid-row:2/8;background:#E30613}
.c1{grid-column:1/4;grid-row:7/9;font-size:22px;font-weight:700;border-top:2px solid #111;padding-top:12px}
.c2{grid-column:4/7;grid-row:7/9;font-size:22px;border-top:2px solid #111;padding-top:12px}
.c3{grid-column:7/9;grid-row:7/9;font-size:22px;border-top:2px solid #111;padding-top:12px}
</style></head><body><div class="r"><span>Sébastien Legros</span><span>2026</span></div><h1>Développeur full-stack</h1><div class="red"></div><div class="c1">React / Go / SQL</div><div class="c2">10 ans</div><div class="c3">La Réunion</div></body></html>
